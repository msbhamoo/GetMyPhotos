services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gmp
      POSTGRES_PASSWORD: gmp
      POSTGRES_DB: gmp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Local stand-in for Cloudflare R2
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb -p local/getmyphotos;
      exit 0"

  api:
    build: ./api
    env_file: .env
    command: sh -c "python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      MIGRATIONS_DIR: /srv/migrations
    volumes:
      - ./db/migrations:/srv/migrations:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./api
    env_file: .env
    # SimpleWorker keeps the face model loaded between jobs (no fork per job)
    command: rq worker face media notify default --url ${REDIS_URL:-redis://redis:6379/0} -w rq.worker.SimpleWorker --with-scheduler
    deploy:
      replicas: 2
    depends_on: [postgres, redis]

  scheduler:
    build: ./api
    env_file: .env
    command: python -m app.worker.scheduler
    depends_on: [postgres, redis]

volumes:
  pgdata:
  miniodata:
